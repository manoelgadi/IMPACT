<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Probability of Default</title>
</head>
<body>
    <h2>Calculate Probability of Default</h2>
    <form action="/probdefault" method="get">
        <label for="time_on_books">Time on Books:</label>
        <input type="number" id="time_on_books" name="time_on_books" required><br><br>

        <label for="total_paid_last_12_months">Total Paid Last 12 Months:</label>
        <input type="number" id="total_paid_last_12_months" name="total_paid_last_12_months" required><br><br>

        <label for="total_debt_in_arrears">Total Debt in Arrears:</label>
        <input type="number" id="total_debt_in_arrears" name="total_debt_in_arrears" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
